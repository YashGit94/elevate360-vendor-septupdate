steps:
  # --- DEPLOY CONSOLIDATED SERVICE ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy All-in-One'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elevate360-service'
      - '--source'
      - '.' # Builds from the current root directory
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--timeout'
      - '600s'

options:
  logging: CLOUD_LOGGING_ONLY
