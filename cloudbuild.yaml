steps:
  # 1. Install dependencies using the lockfile
  - name: 'node:20'
    entrypoint: npm
    args: ['install']

  # 2. Build the Angular application for production
  # This uses the 'build' script defined in your package.json
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']

# Note: Substitutions and artifacts are optional. 
# Remove the artifacts block entirely if you do not have a Cloud Storage bucket ready.
# artifacts:
#   objects:
#     location: 'gs://REPLACE_WITH_ACTUAL_BUCKET_NAME/build-artifacts/'
#     paths: ['dist/sitexx/**']

options:
  logging: CLOUD_LOGGING_ONLY
