steps:
  # --- DEPLOY CONSOLIDATED SERVICE ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Unified Service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elevate360-service'
      - '--source'
      - '.' 
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--timeout'
      - '900s' # Extended to 15 minutes for frontend compilation

options:
  logging: CLOUD_LOGGING_ONLY
