steps:
  # --- DEPLOY ALL-IN-ONE SERVICE ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Unified Service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elevate360-service'
      - '--source'
      - '.' # Build from the current directory
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--timeout'
      - '600s' # Extended timeout for the initial build

options:
  logging: CLOUD_LOGGING_ONLY
