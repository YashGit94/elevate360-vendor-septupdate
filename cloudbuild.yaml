steps:
  # --- STEP 1: Build & Deploy Frontend (Angular) ---
  # Install dependencies for Angular
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: '.'

  # Build the Angular application for production
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: '.'

  # Build the Docker image for the Frontend
  # Assumes a Dockerfile in the root that serves the contents of /dist/sitexx
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/elevate360-frontend', '-f', 'Dockerfile.frontend', '.']

  # --- STEP 2: Build & Deploy Backend (Node.js/BigQuery API) ---
  # Build the Docker image for the Backend
  # Assumes a Dockerfile that runs `node src/index.js`
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/elevate360-backend', '-f', 'Dockerfile.backend', '.']

  # Push images to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/elevate360-frontend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/elevate360-backend']

  # --- STEP 3: Deploy to Cloud Run ---
  # Deploy Backend first to get its URL for the frontend if needed
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elevate360-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/elevate360-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elevate360-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/elevate360-frontend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/elevate360-frontend'
  - 'gcr.io/$PROJECT_ID/elevate360-backend'

timeout: '1200s'
