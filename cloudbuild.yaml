steps:
  # Step 1: Install dependencies for both Frontend and Backend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # Step 2: Build the Angular Frontend
  # Based on angular.json, the project name is 'sitexx'
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['ng', 'build', '--configuration=production']

  # Step 3: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sitexx-app:$COMMIT_SHA', 
      '.'
    ]

  # Step 4: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sitexx-app:$COMMIT_SHA'
    ]

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sitexx-service'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sitexx-app:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sitexx-app:$COMMIT_SHA'

substitutions:
  _REGION: us-central1
  _REPOSITORY: your-repo-name

options:
  logging: CLOUD_LOGGING_ONLY
