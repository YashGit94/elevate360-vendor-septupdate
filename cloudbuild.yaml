steps:
  # --- DEPLOY UNIFIED SERVICE ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elevate360-service'
      - '--source'
      - '.'
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--timeout'
      - '900s' # Increased to 15 minutes for Angular compilation

options:
  logging: CLOUD_LOGGING_ONLY
